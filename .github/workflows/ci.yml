name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run E2E integration fuzzer
        run: npx --yes tsx scripts/e2e-integration-fuzzer.ts
        env:
          VERBOSE: 'true'
          MAX_RUNS: '200'
