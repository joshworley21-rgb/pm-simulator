name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run the full test suite (typecheck + engine + all slice harnesses)
        run: npm test

      - name: Run E2E integration fuzzer
        run: npx --yes tsx scripts/e2e-integration-fuzzer.ts
        env:
          VERBOSE: 'true'
          MAX_RUNS: '200'

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke test
        run: npm run test:ui

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: artifacts/ui-smoke
          if-no-files-found: ignore
