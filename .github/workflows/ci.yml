name: CI

on:
  push:
    branches: [master, uk-rebuild]
  pull_request:

jobs:
  verify:
    name: Typecheck and engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pm-sim-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pm-sim-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Engine regression tests
        run: npm run test:engine
