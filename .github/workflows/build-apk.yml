name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # REORDERED from the original spec: prebuild must run BEFORE setup-java.
      # `android/` is gitignored, so a fresh checkout contains no gradle files and
      # setup-java's `cache: gradle` fails with "No file ... matched to
      # [**/*.gradle*,**/gradle-wrapper.properties,...]". Generating the native
      # project first gives the cache key something to resolve, so the requested
      # gradle caching is kept rather than dropped.
      - run: npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ADDED (not in the original spec). RN 0.88's version catalog defaults to
      # compileSdk 37 / build-tools 37.0.0, but **API 37 is not published**: the
      # package id `platforms;android-37` does not exist on any channel. The only
      # API-37 artifacts are previews (`platforms;android-37.2`, `37.2-beta3`,
      # `platform-canary-*.zip`), which is why sdkmanager reports
      # "Failed to find package 'platforms;android-37'".
      #
      # Pin to the newest STABLE platform instead: API 36 + build-tools 36.0.0 are
      # both present in the stable manifest (repository2-1.xml), as is the NDK.
      - name: Pin Android SDK versions to the latest stable (API 37 is unpublished)
        run: |
          CATALOG=node_modules/react-native/gradle/libs.versions.toml
          sed -i 's/^compileSdk = "37"/compileSdk = "36"/' "$CATALOG"
          sed -i 's/^buildTools = "37.0.0"/buildTools = "36.0.0"/' "$CATALOG"
          grep -E '^(minSdk|targetSdk|compileSdk|buildTools|ndkVersion)' "$CATALOG"

      # ADDED (not in the original spec): install exactly the components the build
      # now needs. All four exist on the STABLE channel.
      - name: Install required Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      # ADDED (not in the original spec): point Gradle at the runner's SDK.
      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Build Debug APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pm-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
