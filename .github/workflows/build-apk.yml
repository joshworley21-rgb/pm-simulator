name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # REORDERED from the original spec: prebuild must run BEFORE setup-java.
      # `android/` is gitignored, so a fresh checkout contains no gradle files and
      # setup-java's `cache: gradle` fails with "No file ... matched to
      # [**/*.gradle*,**/gradle-wrapper.properties,...]". Generating the native
      # project first gives the cache key something to resolve, so the requested
      # gradle caching is kept rather than dropped.
      - run: npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Expo SDK 58's modules declare minCompileSdk 37, but the final API 37
      # platform is not published on the stable channel. Compile every Android
      # module against API 37.2 via the canary-only platform and AGP's minor SDK
      # support.
      - name: Verify Android SDK versions
        run: |
          CATALOG=node_modules/react-native/gradle/libs.versions.toml
          grep -E '^(minSdk|targetSdk|compileSdk|buildTools|ndkVersion)' "$CATALOG"

      - name: Install required Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.30.5"
          "$SDKMANAGER" --channel=3 "platforms;android-37.2"
          test -f "${ANDROID_HOME}/platforms/android-37.2/android.jar"

      - name: Compile all Android modules against API 37.2
        run: |
          cat >> android/build.gradle <<'EOF'

          // Expo SDK 58 AARs require compileSdk 37. API 37 is only published as
          // the 37.2 minor platform, so apply it to every Android module.
          allprojects {
            afterEvaluate { project ->
              def androidExtension = project.extensions.findByName("android")
              if (androidExtension != null) {
                androidExtension.compileSdkVersion = 37
                androidExtension.compileSdkMinor = 2
              }
            }
          }
          EOF
          tail -15 android/build.gradle

      # ADDED (not in the original spec): point Gradle at the runner's SDK.
      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      # The generated template only gives Gradle 2 GB. The release build runs R8
      # and native tooling alongside Metro, so raise the heap and cap workers.
      - name: Increase Gradle memory for the release build
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          printf '\norg.gradle.workers.max=2\n' >> android/gradle.properties
          grep -E '^org\.gradle\.(jvmargs|workers)' android/gradle.properties

      - name: Build Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle-release.log"

      - name: Report Gradle failure
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-release.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Gradle release failure::No Gradle log was captured"
            exit 0
          fi
          if grep -qE 'BUILD FAILED|FAILURE:|What went wrong' "$LOG"; then
            SUMMARY=$(tail -n 160 "$LOG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle release failure::$SUMMARY"
          fi

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-logs
          path: gradle-release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: List release APK
        run: find android/app/build/outputs/apk/release -maxdepth 2 -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pm-simulator-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
