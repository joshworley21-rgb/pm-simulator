name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # REORDERED from the original spec: prebuild must run BEFORE setup-java.
      # `android/` is gitignored, so a fresh checkout contains no gradle files and
      # setup-java's `cache: gradle` fails with "No file ... matched to
      # [**/*.gradle*,**/gradle-wrapper.properties,...]". Generating the native
      # project first gives the cache key something to resolve, so the requested
      # gradle caching is kept rather than dropped.
      - run: npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ADDED (not in the original spec): the generated project targets
      # compileSdk 37 / build-tools 37.0.0 / NDK 27.1.12297006, none of which the
      # ubuntu-latest image ships by default. Installing them explicitly makes the
      # build deterministic instead of relying on AGP's auto-download + licences.
      - name: Install required Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      # ADDED (not in the original spec): point Gradle at the runner's SDK.
      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pm-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
